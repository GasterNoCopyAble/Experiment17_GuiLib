name: Finalize v22 core

on:
  push:
    branches:
      - v22-finalize-core

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build single v22 engine and remove source windows
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          root = Path('.')
          source_dir = root / 'src/v22/core/source'
          parts = [source_dir / f'part{i:02d}.luau' for i in range(1, 30)]

          missing = [str(p) for p in parts if not p.exists()]
          if missing:
              raise SystemExit('Missing v22 core source parts: ' + ', '.join(missing))

          def lines(value):
              return value.replace('\r\n', '\n').replace('\r', '\n').splitlines()

          def same(a, b):
              return a.strip() == b.strip()

          def overlap(left, right):
              maximum = min(len(left), len(right))
              if maximum <= 0:
                  return 0, 0
              minimum = min(6, maximum)
              for amount in range(maximum, minimum - 1, -1):
                  mismatches = 0
                  compared = 0
                  allowed = max(1, int(amount * 0.08 + 0.5))
                  for offset in range(amount):
                      if not same(left[len(left) - amount + offset], right[offset]):
                          mismatches += 1
                          if mismatches > allowed:
                              break
                      compared += 1
                  if compared == amount and mismatches <= allowed:
                      first_ok = same(left[len(left)-amount], right[0]) or (amount >= 2 and same(left[len(left)-amount+1], right[1]))
                      last_ok = same(left[-1], right[amount-1]) or (amount >= 2 and same(left[-2], right[amount-2]))
                      if first_ok and last_ok:
                          return amount, mismatches
              return 0, 0

          merged = lines(parts[0].read_text(encoding='utf-8'))
          removed = 0
          fuzzy = 0
          no_overlap = []

          for index, part in enumerate(parts[1:], start=2):
              right = lines(part.read_text(encoding='utf-8'))
              amount, mismatches = overlap(merged, right)
              if amount:
                  removed += amount
                  fuzzy += int(mismatches > 0)
                  merged.extend(right[amount:])
              else:
                  # This mirrors the previously working runtime assembler: a
                  # boundary with no overlap is a normal hard split, not a fatal error.
                  no_overlap.append(index)
                  merged.append('')
                  merged.extend(right)

          engine = '\n'.join(merged) + '\n'
          engine = engine.replace('Experiment 17 [Visuals] - UI Library v21', 'Experiment 17 [Visuals] - UI Library v22', 1)
          engine = engine.replace('        version = 21,', '        version = 22,', 1)
          engine = engine.replace('    while version < 21 and guard < 32 do', '    while version < 22 and guard < 32 do', 1)

          if 'v21' in engine.lower():
              raise SystemExit('Unexpected v21 marker remains in generated Engine.luau')
          if 'return Library' not in engine:
              raise SystemExit('Generated Engine.luau does not return Library')

          (root / 'src/v22/core/Engine.luau').write_text(engine, encoding='utf-8')

          main = '''-- Experiment 17 UI Library v22\n-- Small bootstrap: load the v22 core engine, then install feature modules.\n\nlocal REPO = "https://raw.githubusercontent.com/GasterNoCopyAble/Experiment17_GuiLib/main/src/v22/"\nlocal compiler = loadstring or (getgenv and getgenv().loadstring)\n\nif type(compiler) ~= "function" then\n    error("[Experiment17] loadstring is unavailable in this environment")\nend\n\nlocal function loadRemote(path)\n    local ok, source = pcall(function()\n        return game:HttpGet(REPO .. path)\n    end)\n    if not ok or type(source) ~= "string" or #source == 0 then\n        error("[Experiment17] Failed to download v22 module " .. tostring(path) .. ": " .. tostring(source))\n    end\n    local chunk, compileError = compiler(source)\n    if not chunk then\n        error("[Experiment17] Failed to compile v22 module " .. tostring(path) .. ": " .. tostring(compileError))\n    end\n    return chunk()\nend\n\nlocal Library = loadRemote("core/Engine.luau")\nif type(Library) ~= "table" then\n    error("[Experiment17] v22 core did not return Library")\nend\n\nLibrary.Version = "v22"\nLibrary.ModuleVersion = 22\nLibrary.Modules = Library.Modules or {}\nLibrary.__E17ModuleCleanups = Library.__E17ModuleCleanups or {}\n\nlocal MODULES = {"Mobile", "Sliders", "RGB", "Gradients", "Tiles"}\nfor _, moduleName in ipairs(MODULES) do\n    local installer = loadRemote("modules/" .. moduleName .. ".luau")\n    if type(installer) ~= "function" then\n        error("[Experiment17] Module " .. moduleName .. " did not return an installer")\n    end\n    local ok, cleanup = pcall(installer, Library)\n    if not ok then\n        error("[Experiment17] Module " .. moduleName .. " failed: " .. tostring(cleanup))\n    end\n    Library.Modules[moduleName] = true\n    if type(cleanup) == "function" then\n        table.insert(Library.__E17ModuleCleanups, cleanup)\n    end\nend\n\nlocal rawUnload = Library.Unload\nif type(rawUnload) == "function" and not Library.__E17V22UnloadWrapped then\n    Library.__E17V22UnloadWrapped = true\n    function Library:Unload(...)\n        for index = #self.__E17ModuleCleanups, 1, -1 do\n            pcall(self.__E17ModuleCleanups[index])\n        end\n        table.clear(self.__E17ModuleCleanups)\n        return rawUnload(self, ...)\n    end\nend\n\nreturn Library\n'''
          (root / 'src/v22/core/Main.luau').write_text(main, encoding='utf-8')

          assembler = root / 'src/v22/core/SourceAssembler.luau'
          if assembler.exists():
              assembler.unlink()
          for p in parts:
              p.unlink()
          source_dir.rmdir()

          readme_path = root / 'README.md'
          readme = readme_path.read_text(encoding='utf-8')
          readme = readme.replace(
              '- The stable base UI engine now lives entirely under `src/v22/core/`\n- `core/SourceAssembler.luau` reconstructs the internal v22 core source snapshot from `core/source/partXX.luau`\n- The runtime no longer accesses any `src/v21/` path and the old v21 directory is removed\n',
              '- The complete base UI engine now lives in `src/v22/core/Engine.luau`\n- Runtime source-window assembly and fuzzy merging were removed\n- Startup now downloads one core engine file plus the feature modules\n'
          )
          readme = re.sub(
              r'        │   ├── Main\.luau\n        │   ├── SourceAssembler\.luau\n        │   └── source/\n        │       ├── part01\.luau\n        │       ├── \.\.\.\n        │       └── part29\.luau\n',
              '        │   ├── Main.luau\n        │   └── Engine.luau\n',
              readme
          )
          readme = readme.replace(
              '`Experiment17.lua` is intentionally tiny. It loads `core/Main.luau`; `Main.luau` builds the v22 base through `core/SourceAssembler.luau` and then installs the feature modules. There is no `src/v21/` runtime dependency anymore.',
              '`Experiment17.lua` is intentionally tiny. It loads `core/Main.luau`; `Main.luau` loads the single `core/Engine.luau` base and then installs the feature modules. There is no runtime source-window assembler or `src/v21/` dependency.'
          )
          readme = readme.replace(
              '- Old `src/v21/partXX.luau` source windows and `LegacyAssembler.luau` were removed from the active repository structure\n',
              '- Old v21 source windows, `LegacyAssembler.luau`, and the temporary v22 source assembler were removed\n'
          )
          readme_path.write_text(readme, encoding='utf-8')

          workflow = root / '.github/workflows/finalize-v22-core.yml'
          if workflow.exists():
              workflow.unlink()

          print(f'Built Engine.luau: {len(engine):,} bytes')
          print(f'Removed overlap lines: {removed}; fuzzy boundaries: {fuzzy}; hard boundaries: {no_overlap}')
          PY

      - name: Commit finalized v22 core
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "refactor(v22): collapse core windows into Engine.luau"
          git push origin HEAD:v22-finalize-core
